<title>Matika do dvaceti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #EEF2F8;
    --card: #FFFFFF;
    --paper: #FBFCFE;
    --paper-line: #C9DAF0;
    --paper-margin: #F0A6A0;
    --ink: #16233B;
    --ink-soft: #5A6B87;
    --line: #D7E0EC;
    --accent: #2747B8;
    --accent-soft: #DEE4F7;
    --on-accent: #FFFFFF;
    --ok: #12996B;
    --warn: #E8A317;
    --bad: #DC4A3D;
    --shadow: 0 1px 0 rgba(22,35,59,.06), 0 10px 24px -14px rgba(22,35,59,.28);

    --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --ui: "Lexend", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  /* Telefon: hra má celou šířku, zeď a truhla stojí v pásu pod ní.
     Od 30rem se zeď přesune do svislého pruhu vpravo (viz níž). */
  .page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "head head" "main main" "rail chest";
    gap: .75rem;
    align-items: stretch;
    --bw-base: 1.75rem;
    max-width: 38rem;
    margin: 0 auto;
    padding: 1rem .375rem 2.5rem;
  }

  .page:not(.has-chest) {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "main" "rail";
  }

  .wrap {
    grid-area: main;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  /* ---------- věž ---------- */

  .rail {
    grid-area: rail;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .375rem;
    --zoom: 1;
    --bw: calc(var(--bw-base) * var(--zoom));
    --gap-x: calc(var(--bw) * 0.18);      /* mezera mezi zdmi */
    --step-x: calc(var(--bw) + var(--gap-x));
  }

  /* měřítko kostky v pixelech pro výpočet mřížky (mimo tok stránky) */
  .bw-probe {
    position: absolute;
    top: 0;
    width: var(--bw-base);
    height: 0;
  }

  /* v pásu na telefonu jsou popisky zbytečné, počty stačí */
  .rail .lab,
  .chest-col .lab { display: none; }

  .blk-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .tower {
    position: relative;
    width: calc(var(--cols, 1) * var(--step-x) - var(--gap-x));
    height: calc(var(--bw-base) * 4.5);   /* pás na telefonu */
    overflow: hidden;
  }

  /* ---------- truhla ---------- */

  .chest-col {
    grid-area: chest;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3125rem;
  }

  /* Truhly stojí na stejné zemi jako zeď a stohují se nahoru — další se objeví,
     až když je ta pod ní úplně plná. */
  .chest-stack {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    align-items: flex-start;         /* další truhla zarovnaná zleva */
    gap: 0;
  }

  /* truhla navrch sedí na víku té spodní, ne nad ním */
  .chest-stack .chest + .chest,
  .chest-stack .chest:not(:first-child) {
    margin-bottom: calc(var(--chest-w) * -0.16);
  }

  .chest {
    --chest-w: calc(var(--bw-base) * 1.4);
    appearance: none;
    border: 0;
    padding: 0;
    background: none;
    width: var(--chest-w);
    cursor: pointer;
    display: block;
  }

  .chest.double { --chest-w: calc(var(--bw-base) * 2.3); }
  .chest svg { display: block; width: 100%; height: auto; }
  .chest:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
  .chest.pop { animation: pop .5s ease; }

  @keyframes pop {
    40% { transform: scale(1.18) translateY(-4px); }
  }

  .chest-n {
    font-family: var(--display);
    font-weight: 800;
    font-size: .8125rem;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* inventář v minecraftovém stylu */
  /* Inventář se otevírá kliknutím a vyskočí nad truhlu (nahoře je volné místo,
     zeď roste odspodu). */
  .chest-panel {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + .5rem);
    z-index: 30;
    width: max-content;
    padding: .5rem;
    background: #C6C6C6;
    border: 2px solid;
    border-color: #FFFFFF #565656 #565656 #FFFFFF;
    box-shadow: 0 10px 28px -12px rgba(22, 35, 59, .55);
    cursor: default;
  }

  .chest-col.open .chest-panel { display: block; }

  .chest-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.25rem;
    margin-bottom: .375rem;
    color: #2C2C2C;
    font-size: .75rem;
  }

  .chest-head b { font-family: var(--display); font-weight: 800; font-size: .9375rem; }
  .chest-head span { font-variant-numeric: tabular-nums; }

  .chest-grid {
    display: grid;
    grid-template-columns: repeat(9, 1.5rem);
    gap: .1875rem;
  }

  .slot {
    position: relative;
    width: 1.5rem;
    height: 1.5rem;
    background: #8B8B8B;
    border: 2px solid;
    border-color: #565656 #FFFFFF #FFFFFF #565656;
  }

  .slot svg { display: block; width: 100%; height: 100%; }

  .slot b {
    position: absolute;
    right: 0;
    bottom: -2px;
    font-family: var(--display);
    font-weight: 800;
    font-size: .8125rem;
    line-height: 1;
    color: #FFFFFF;
    text-shadow: 1px 1px 0 #333333;
    font-variant-numeric: tabular-nums;
  }

  @media (min-width: 30rem) {
    .chest-grid { grid-template-columns: repeat(9, 1.875rem); }
    .slot { width: 1.875rem; height: 1.875rem; }
    .slot b { font-size: .875rem; }
  }

  /* --c je sloupec zleva, --r patro odspodu */
  .brick {
    position: absolute;
    width: var(--bw);
    height: var(--bw);
    left: calc(var(--c) * var(--step-x));
    bottom: calc(var(--r) * var(--bw) * 0.75);
    z-index: var(--r);
  }

  .brick svg { display: block; width: 100%; height: 100%; }

  .brick.new { animation: drop .34s cubic-bezier(.25,1.3,.5,1); }
  .brick.gone { animation: topple .36s ease-in forwards; }

  @keyframes drop {
    from { opacity: 0; transform: translateY(-2.25rem); }
  }

  @keyframes topple {
    to { opacity: 0; transform: translate(2rem, .75rem) rotate(42deg); }
  }

  .tower-count {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.125rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    text-align: center;
  }

  .tower-count span { font-family: var(--ui); font-weight: 500; font-size: .75rem; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    .brick.new { animation: none; }
    .brick.gone { display: none; }
  }

  @media (min-width: 22.5rem) {
    .page { padding: 1.25rem .75rem 2.5rem; --bw-base: 1.875rem; }
    .sheet { padding: 1.75rem 1rem 1.5rem 3.25rem; }
    .sheet::before { left: 2.5rem; }
  }

  /* Na šířku (a s dost místa) se zeď i truhly přesunou do pruhu vpravo. */
  @media (min-width: 30rem) and (orientation: landscape) {
    .page {
      --bw-base: 3.25rem;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "head head" "main rail";
      gap: 1.5rem;
    }

    /* stejná specificita jako mobilní pravidlo, jinak by ho nepřebilo */
    .page:not(.has-chest) {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "head head" "main rail";
    }

    .page.has-chest {
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-areas: "head head head" "main rail chest";
    }

    .rail { align-items: center; gap: .5rem; }

    .rail .lab,
    .chest-col .lab { display: block; margin: 0; text-align: center; }

    .tower {
      height: auto;
      flex: 1 1 auto;
      align-self: stretch;
      min-height: calc(var(--bw) * 4);
    }

  }

  @media (min-width: 48rem) {
    .page { max-width: 46rem; gap: 2.5rem; padding: 2rem 1.5rem 3rem; }
    .wrap { gap: 1.25rem; }
    h1 { font-size: 1.875rem; }
    .sheet { padding: 2.75rem 1.5rem 2.5rem 4rem; }
    .sheet::before { left: 3rem; }
    .page.has-chest { max-width: 56rem; gap: 1.5rem; }
    .chest { --chest-w: calc(var(--bw-base) * 1.5); }
    .chest.double { --chest-w: calc(var(--bw-base) * 2.4); }
    .pad { max-width: 22rem; align-self: center; width: 100%; gap: .625rem; }
    .pad button { font-size: 1.75rem; padding: .75rem 0; }
    .pad .go, .pad .del { font-size: 1.125rem; }
    .setup { padding: 1rem 1.125rem; }
  }

  @media (min-width: 48rem) and (orientation: landscape) {
    .page { --bw-base: 4rem; }
  }

  /* ---------- hlavička ---------- */

  .top {
    grid-area: head;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .75rem;
  }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.5rem;
    line-height: 1.1;
    letter-spacing: -.01em;
    margin: 0;
    text-wrap: balance;
  }

  .best {
    font-size: .8125rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .best b { color: var(--ink); font-weight: 600; }

  /* ---------- nastavení ---------- */

  .setup {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: .875rem;
    display: grid;
    gap: .75rem;
    grid-template-columns: 1fr 1fr;
  }

  .setup .row:last-child { grid-column: 1 / -1; }

  .lab {
    display: block;
    font-size: .6875rem;
    font-weight: 500;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: .375rem;
  }

  .seg {
    display: flex;
    gap: .25rem;
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .25rem;
  }

  .seg button {
    flex: 1 1 0;
    min-width: 0;
    appearance: none;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: .9375rem;
    font-weight: 500;
    padding: .375rem .25rem;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  .seg button:hover { color: var(--ink); }

  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  .ops {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .375rem;
  }

  .chip {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .0625rem;
    padding: .375rem .125rem .3125rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--ground);
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }

  .chip input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    margin: 0;
  }

  .chip span {
    font-family: var(--display);
    font-weight: 700;
    font-size: 2rem;
    line-height: 1;
  }

  .chip em {
    font-style: normal;
    font-size: .625rem;
    letter-spacing: .03em;
  }

  .chip:hover { color: var(--ink); }

  .chip input:checked ~ span,
  .chip input:checked ~ em { color: var(--on-accent); }

  .chip:has(input:checked) {
    background: var(--accent);
    border-color: var(--accent);
  }

  .chip:has(input:focus-visible) { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  /* název kostky pod kurzorem */
  .mc-tip {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 60;
    display: none;
    padding: .1875rem .4375rem .25rem;
    background: rgba(16, 0, 16, .94);
    border: 2px solid #2B0080;
    color: #FFFFFF;
    font-family: var(--display);
    font-weight: 700;
    font-size: .875rem;
    line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
  }

  .mc-tip.on { display: block; }

  /* ---------- stavění ---------- */

  .mode {
    appearance: none;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--card);
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    font-size: .8125rem;
    padding: .25rem .875rem;
    cursor: pointer;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .mode[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .mode:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .mode.locked {
    border-color: var(--line);
    color: var(--ink-soft);
    cursor: default;
  }

  .build {
    grid-area: main;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  .canvas-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: .5rem;
    overflow: hidden;
  }

  /* Kostky se kladou do jedné vrstvy, ale kreslí se jako stoh: řady se překrývají
     o čtvrtinu kostky (stejně jako zeď), takže mezi nimi nejsou mezery a stavba
     se čte prostorově. Rozteč řady je proto 0,75 × šířka kostky. */
  .canvas {
    position: relative;
    width: calc(var(--cols-b) * var(--cell));
    height: calc((var(--rows-b) - 1) * var(--cell) * 0.75 + var(--cell));
    touch-action: none;
  }

  /* terč pro prst: výška = rozteč řady, takže se terče nepřekrývají */
  .cell {
    position: absolute;
    left: calc(var(--c) * var(--cell));
    bottom: calc(var(--r) * var(--cell) * 0.75);
    width: var(--cell);
    height: calc(var(--cell) * 0.75);
    z-index: 1;
    box-shadow: inset -1px -1px 0 var(--line);
  }

  .cell.hint { background: var(--accent-soft); }

  /* kostka je čtvercová a přečnívá nad svůj terč — vyšší řada kreslí přes spodní */
  .blk {
    position: absolute;
    left: calc(var(--c) * var(--cell));
    bottom: calc(var(--r) * var(--cell) * 0.75);
    width: var(--cell);
    height: var(--cell);
    z-index: calc(2 + var(--r));
    pointer-events: none;
  }

  .blk svg { display: block; width: 100%; height: 100%; }

  .palette {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  .palette-row {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    gap: .375rem;
  }

  .pick {
    position: relative;
    flex: 0 0 auto;
    appearance: none;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    padding: .1875rem;
    width: 2.5rem;
    cursor: pointer;
    touch-action: none;
  }

  .pick svg { display: block; width: 100%; height: auto; }
  .pick b {
    display: block;
    font-family: var(--display);
    font-weight: 800;
    font-size: .8125rem;
    line-height: 1.1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .pick:disabled { opacity: .4; cursor: default; }
  .pick:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .wreck {
    flex: 0 0 auto;
    appearance: none;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink-soft);
    font: inherit;
    font-weight: 600;
    font-size: .875rem;
    padding: .5rem .75rem;
    cursor: pointer;
  }

  .wreck[aria-pressed="true"] { border-color: var(--bad); background: var(--bad); color: #FFFFFF; }
  .wreck:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  /* kostka tažená prstem/myší */
  .drag {
    position: fixed;
    z-index: 70;
    pointer-events: none;
    opacity: .9;
  }

  .drag svg { display: block; width: 100%; height: 100%; }

  /* ---------- list papíru ---------- */

  .sheet {
    position: relative;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(to right, var(--paper-line) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(to bottom, var(--paper-line) 0 1px, transparent 1px 26px);
    background-position: -1px -1px;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.5rem .625rem 1.25rem 2.125rem;
    overflow: auto hidden;
    container-type: inline-size;
  }

  /* pevný okraj sešitu — text za tuto linku nikdy nepřeteče */
  .sheet::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 1.375rem;
    width: 2px;
    background: var(--paper-margin);
  }

  .task {
    display: flex;
    flex-wrap: nowrap;
    white-space: nowrap;
    align-items: center;
    justify-content: center;
    gap: 0 .18em;
    font-family: var(--display);
    font-weight: 700;
    font-size: var(--fs);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }

  /* Velikost se odvozuje od šířky sešitu (cqw) a počtu čísel, takže příklad
     zůstane na jednom řádku od 320px po desktop. */
  .task[data-n="2"] { --fs: clamp(1.375rem, 14.5cqw, 3.25rem); }
  .task[data-n="3"] { --fs: clamp(1.0625rem, 11cqw, 2.875rem); }
  .task[data-n="4"] { --fs: clamp(.875rem, 9cqw, 2.5rem); }

  .task .op { color: var(--accent); padding: 0 .0625rem; }
  .task .eq { color: var(--ink-soft); }

  /* Není to <input> — číslice zapisujeme sami, takže na mobilu nevyskočí
     systémová klávesnice a nic se neposune. */
  #answer {
    display: inline-block;
    width: 2.4em;
    padding: .06em .1em .1em;
    border: 2px dashed var(--accent);
    border-radius: .2em;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: inherit;
    text-align: center;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* Rámeček není <input>, tak si kurzor nakreslíme: dokud je prázdno, bliká
     před otazníkem, po zapsání čísla za ním. */
  #answer:empty::after { content: "?"; color: var(--line); }

  #answer:empty::before,
  #answer:not(:empty)::after {
    content: "";
    display: inline-block;
    width: .09em;
    height: .7em;
    vertical-align: -.085em;
    background: var(--accent);
    animation: caret 1.1s step-end infinite;
  }

  #answer:empty::before { margin-right: .08em; }
  #answer:not(:empty)::after { margin-left: .08em; }

  #answer.locked::before,
  #answer.locked::after { display: none; }

  @keyframes caret { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #answer::before,
    #answer::after { animation: none; }
  }

  .sheet.is-ok #answer { border-style: solid; border-color: var(--ok); color: var(--ok); }
  .sheet.is-bad #answer { border-style: solid; border-color: var(--bad); color: var(--bad); }
  .sheet.is-shake { animation: shake .34s ease; }

  @keyframes shake {
    10%, 90% { transform: translateX(-3px); }
    30%, 70% { transform: translateX(5px); }
    50% { transform: translateX(-5px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sheet.is-shake { animation: none; }
  }

  .note {
    margin: 1rem 0 0;
    min-height: 1.5rem;
    text-align: center;
    font-weight: 500;
    font-size: 1rem;
    color: var(--ink-soft);
  }

  .note.ok { color: var(--ok); }
  .note.bad { color: var(--bad); }
  .note b { font-family: var(--display); font-weight: 800; font-size: 1.25rem; }

  /* ---------- klávesnice ---------- */

  .pad {
    display: grid;
    width: 100%;
    grid-template-columns: repeat(3, 1fr);
    gap: .5rem;
  }

  .pad button {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.5rem;
    padding: .625rem 0;
    cursor: pointer;
    box-shadow: 0 1px 0 var(--line);
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }

  .pad button:active { transform: translateY(1px); box-shadow: none; }
  .pad button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .pad .go {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-family: var(--ui);
    font-size: 1rem;
    font-weight: 600;
  }

  .pad .del { font-family: var(--ui); font-size: 1rem; font-weight: 600; color: var(--ink-soft); }

  /* ---------- průběh série ---------- */

  .progress {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4375rem;
    flex-wrap: wrap;
  }

  .dot {
    width: .875rem;
    height: .875rem;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
  }

  .dot.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .dot.first { border-color: var(--ok); background: var(--ok); }
  .dot.second { border-color: var(--warn); background: var(--warn); }
  .dot.miss { border-color: var(--bad); background: transparent; }

  /* ---------- konec série ---------- */

  .done {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.5rem 1.25rem;
    text-align: center;
    display: grid;
    gap: .75rem;
    justify-items: center;
  }

  .done h2 {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.75rem;
    margin: 0;
  }

  .stars { font-size: 1.75rem; letter-spacing: .125rem; line-height: 1; }
  .done p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }

  .again {
    appearance: none;
    border: 0;
    border-radius: 11px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    font-size: 1rem;
    padding: .625rem 1.5rem;
    cursor: pointer;
  }

  .again:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .foot {
    text-align: center;
    font-size: .75rem;
    color: var(--ink-soft);
  }

  [hidden] { display: none !important; }
  /* Tablet na výšku: pás pod hrou zůstává, jen kostky můžou být větší. */
  @media (min-width: 30rem) and (orientation: portrait) {
    .page { --bw-base: 2.5rem; padding-bottom: 1.25rem; }
  }

  /* Na šířku se celá appka vejde do okna: výšku rozdělí sešit a klávesnice,
     takže není potřeba posuvník. */
  @media (min-width: 30rem) and (orientation: landscape) {
    html, body { height: 100%; }

    .page {
      height: 100vh;
      height: 100svh;
      grid-template-rows: auto minmax(0, 1fr);
      padding-top: 1rem;
      padding-bottom: 1rem;
      row-gap: .75rem;
    }

    .wrap {
      min-height: 0;
      gap: .625rem;
      container-type: size;      /* aby šlo měřit velikosti podle výšky (cqh) */
    }

    .setup { flex: 0 0 auto; padding: .625rem .875rem; }
    .setup .lab { margin-bottom: .1875rem; }
    .chip { padding: .1875rem .125rem; }
    .chip span { font-size: clamp(1.25rem, 5.5cqh, 2rem); }

    .sheet {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: .75rem 1rem .75rem 3.25rem;
    }

    .sheet::before { left: 2.5rem; }
    .note { margin-top: .5rem; min-height: 1.25rem; font-size: .9375rem; }

    .pad {
      flex: 2 1 auto;
      min-height: 0;
      grid-auto-rows: minmax(0, 1fr);
      gap: .4375rem;
    }

    .pad button {
      padding: 0;
      min-height: 0;
      line-height: 1;
      font-size: clamp(1rem, 7cqh, 1.75rem);
    }
    .pad .go, .pad .del { font-size: clamp(.8125rem, 3.6cqh, 1.125rem); }

    .progress { flex: 0 0 auto; }
    .foot { display: none; }     /* na šířku není na nápovědu místo */
  }

  /* Nízké okno na šířku (telefon na šířku, malé okno na notebooku): nastavení
     se srovná do jednoho řádku, ať zbyde výška na příklad a klávesnici. */
  @media (orientation: landscape) and (max-height: 34rem) {
    .page { padding-top: .625rem; padding-bottom: .625rem; row-gap: .5rem; }
    h1 { font-size: 1.125rem; }

    .setup {
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: center;
      gap: .5rem;
      padding: .4375rem .5rem;
    }

    .setup .row:last-child { grid-column: auto; }
    .setup .lab { display: none; }
    .seg { padding: .1875rem; }
    .seg button { font-size: .8125rem; padding: .25rem .3125rem; white-space: nowrap; }
    .chip { padding: .1875rem .125rem; gap: 0; }
    .chip em { display: none; }
    .chip span { font-size: 1.25rem; }
    .ops { gap: .25rem; }

    .wrap { gap: .4375rem; }
    .sheet { padding: .4375rem .625rem .4375rem 2.5rem; }
    .sheet::before { left: 1.75rem; }
    .note { margin-top: .25rem; min-height: 1rem; font-size: .8125rem; }
    .pad { gap: .3125rem; }
    .progress { gap: .3125rem; }
    .dot { width: .625rem; height: .625rem; border-width: 2px; }
  }

  /* Režim stavění zabírá celou stránku — zeď ani truhly se nezobrazují.
     Musí být za pravidly pro orientaci, jinak by ho přebila (stejná specificita). */
  .page.building {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "main";
    min-height: 100svh;
  }

  .page.building .build { justify-content: center; }

<div class="page" id="page">
<div class="top">
  <h1>Matika do dvaceti</h1>

  <button type="button" class="mode" id="mode" aria-pressed="false" hidden>
    <span id="mode-label">Stavění</span>
  </button>

  <div class="best">série <b id="streak">0</b> · nejlepší <b id="best">0</b></div>
</div>

<div class="wrap">
  <div class="setup">
    <div class="row">
      <span class="lab" id="lab-range">Počítáme</span>
      <div class="seg" role="group" aria-labelledby="lab-range" id="seg-range">

    </div>

    <div class="row">
      <span class="lab" id="lab-terms">Počet čísel</span>
      <div class="seg" role="group" aria-labelledby="lab-terms" id="seg-terms">
        <button type="button" data-v="2">2</button>

    <div class="row">
      <span class="lab" id="lab-ops">Znaménka</span>

        <label class="chip"><input type="checkbox" value="add"><span aria-hidden="true">+</span><em>plus</em></label>
        <label class="chip"><input type="checkbox" value="sub"><span aria-hidden="true">−</span><em>minus</em></label>
        <label class="chip"><input type="checkbox" value="mul"><span aria-hidden="true">×</span><em>krát</em></label>
        <label class="chip"><input type="checkbox" value="div"><span aria-hidden="true">÷</span><em>děleno</em></label>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="task" id="task"></div>

<div class="rail" id="rail">

</div>

<div class="chest-col" id="chest-col" hidden>
  <span class="lab" id="chest-lab">Truhla</span>

  <div class="chest-stack" id="chest-stack"></div>

  <div class="chest-panel" id="chest-panel" role="dialog" aria-label="Obsah truhly">
    <div class="chest-head"><b id="chest-title">Truhla</b><span id="chest-size">3 × 9</span></div>
    <div class="chest-grid" id="chest-grid"></div>
  </div>
</div>
</div>

<script>
(function () {
  "use strict";

  var ROUND = 10;
  var OPS = {
    add: { sym: "+", fam: "sum" },
    sub: { sym: "−", fam: "sum" },
    mul: { sym: "×", fam: "prod" },
    div: { sym: "÷", fam: "prod" }
  };
  var OP_KEYS = ["add", "sub", "mul", "div"];

  var HIGH_FROM = 11;    // "do 20" má cvičit přechod přes desítku
  var EASY_SHARE = 20;   // ...ale každý pátý příklad může zůstat pod deseti

  var HINT_AFTER = 3;    // po třech omylech napovíme, ať syn neuvízne
  var RAIL_SHARE = 0.32; // kolik šířky stránky smí zeď nejvýš zabrat
  var BANK_SIZE = 50;    // po kolika kostkách se zeď uloží do truhly
  var CHEST_SLOTS = 27;  // minecraftová truhla 3 × 9 (velká má dvojnásobek)
  var STACK = 64;        // víc než 64 kostek se na jedno políčko nevejde
  var GAP_X = 0.18;      // mezera mezi sloupci zdi, násobek šířky kostky (viz --gap-x)
  var KEY = "matika-do-dvaceti";

  var cfg = { range: 10, terms: 2, ops: { add: true, sub: true, mul: false, div: false } };
  var best = 0;
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { /* úložiště nedostupné */ }
  if (saved.range === 10 || saved.range === 20) cfg.range = saved.range;
  if (saved.terms >= 2 && saved.terms <= 4) cfg.terms = saved.terms;
  if (typeof saved.ops === "string") {
    // starší uložené nastavení (jen +, jen −, + i −)
    cfg.ops = { add: saved.ops !== "sub", sub: saved.ops !== "add", mul: false, div: false };
  } else if (saved.ops && typeof saved.ops === "object") {
    OP_KEYS.forEach(function (k) { cfg.ops[k] = !!saved.ops[k]; });
    if (!OP_KEYS.some(function (k) { return cfg.ops[k]; })) cfg.ops.add = true;
  }
  best = Math.max(0, parseInt(saved.best, 10) || 0);

  var tower = Math.max(0, parseInt(saved.tower, 10) || 0);
  var BUILD_COLS = 16;   // pevná logická mřížka, ať stavba vypadá stejně na každém displeji
  var BUILD_ROWS = 12;

  var banked = Math.max(0, parseInt(saved.banked, 10) || 0);
  banked -= banked % BANK_SIZE;      // v truhle jsou vždy celé padesátky

  var task = null;      // { terms: [n, ...], ops: ["+", ...], result: n }
  var results = [];     // "first" | "second" | "miss"
  var tries = 0;
  var streak = 0;      // aktuální nepřerušená řada napoprvé
  var roundBest = 0;   // nejdelší řada v tomto kole
  var locked = false;

  var el = {
    task: document.getElementById("task"),
    wrap: document.querySelector(".wrap"),
    note: document.getElementById("note"),
    sheet: document.getElementById("sheet"),
    pad: document.getElementById("pad"),
    progress: document.getElementById("progress"),
    done: document.getElementById("done"),
    stars: document.getElementById("stars"),
    score: document.getElementById("score"),
    summary: document.getElementById("summary"),
    again: document.getElementById("again"),
    best: document.getElementById("best"),
    streak: document.getElementById("streak"),
    page: document.getElementById("page"),
    rail: document.getElementById("rail"),
    probe: document.getElementById("bw-probe"),
    tower: document.getElementById("tower"),
    towerCount: document.getElementById("tower-count"),
    chestCol: document.getElementById("chest-col"),
    chestStack: document.getElementById("chest-stack"),
    chestPanel: document.getElementById("chest-panel"),
    chestLab: document.getElementById("chest-lab"),
    chestN: document.getElementById("chest-n"),
    chestTitle: document.getElementById("chest-title"),
    chestSize: document.getElementById("chest-size"),
    chestGrid: document.getElementById("chest-grid"),
    mode: document.getElementById("mode"),
    modeLabel: document.getElementById("mode-label"),
    build: document.getElementById("build"),
    canvas: document.getElementById("canvas"),
    canvasWrap: document.querySelector(".canvas-wrap"),
    paletteRow: document.getElementById("palette-row"),
    wreck: document.getElementById("wreck")
  };

  var answer = null;   // rámeček s výsledkem (obyčejný prvek, ne <input>)

  function rnd(n) { return Math.floor(Math.random() * n); }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        range: cfg.range, terms: cfg.terms, ops: cfg.ops, best: best,
        tower: tower, banked: banked, build: build
      }));
    } catch (e) {}
  }

  /* Příklad se skládá z bloků: blok je jedno číslo nebo řetězec × ÷, bloky se pak
     sčítají a odčítají. Tím platí přednost × ÷ před + − a zápis dává matematicky
     správný výsledek. Průběžně se kontroluje, že každý mezivýsledek zůstane celé
     číslo v rozsahu 1..range — žádné minus, žádné přetečení, dělení beze zbytku. */
  /* relaxed povolí i dělení sebou samým (x÷x=1) — jen když jinak nejde příklad
     vůbec sestavit, třeba „do 10, jen ÷, 4 čísla". */
  function candidates(op, running, max, relaxed) {
    var list = [], n;
    if (op === "add") { for (n = 1; n <= max - running; n++) list.push(n); }
    else if (op === "sub") { for (n = 1; n <= running - 1; n++) list.push(n); }
    else if (op === "mul") { for (n = 2; n * running <= max; n++) list.push(n); }
    else if (op === "div") {
      for (n = 2; n < running; n++) { if (running % n === 0) list.push(n); }
      if (relaxed && running >= 2) list.push(running);
    }
    return list;
  }

  function applyOp(op, running, n) {
    if (op === "add") return running + n;
    if (op === "sub") return running - n;
    if (op === "mul") return running * n;
    return running / n;
  }

  function shuffled(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = rnd(i + 1); t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function activeOps() {
    var on = OP_KEYS.filter(function (k) { return cfg.ops[k]; });
    return on.length ? on : ["add"];
  }

  function pickOp(pool, running, relaxed) {
    var order = shuffled(pool), i, c;
    for (i = 0; i < order.length; i++) {
      c = candidates(order[i], running, cfg.range, relaxed);
      if (c.length) return { op: order[i], n: c[rnd(c.length)] };
    }
    return null;
  }

  /* Blok o délce len s hodnotou v intervalu [lo, hi]. */
  function makeBlock(len, lo, hi, prodPool, relaxed) {
    if (lo > hi) return null;
    if (len === 1) return { value: lo + rnd(hi - lo + 1), nums: null, syms: [] };

    for (var attempt = 0; attempt < 60; attempt++) {
      var value = 1 + rnd(cfg.range);
      var nums = [value];
      var syms = [];
      var ok = true;

      for (var i = 1; i < len; i++) {
        var picked = pickOp(prodPool, value, relaxed);
        if (!picked) { ok = false; break; }
        value = applyOp(picked.op, value, picked.n);
        nums.push(picked.n);
        syms.push(OPS[picked.op].sym);
      }

      if (ok && value >= lo && value <= hi) return { value: value, nums: nums, syms: syms };
    }
    return null;
  }

  /* Náhodné rozdělení počtu čísel na bloky. */
  function composition(n, canGroup) {
    if (!canGroup) {
      var ones = [];
      while (ones.length < n) ones.push(1);
      return ones;
    }
    var parts = [], left = n;
    while (left > 0) {
      var len = 1 + rnd(left);
      parts.push(len);
      left -= len;
    }
    return parts;
  }

  function makeTask() {
    return buildTask(false) || buildTask(true) || { terms: [1, 1], ops: ["+"], result: 2 };
  }

  function buildTask(relaxed) {
    var on = activeOps();
    var sumPool = on.filter(function (k) { return OPS[k].fam === "sum"; });
    var prodPool = on.filter(function (k) { return OPS[k].fam === "prod"; });

    for (var attempt = 0; attempt < 300; attempt++) {
      // bez + a − musí být všechna čísla v jednom bloku, bez × a ÷ naopak každé samo
      var comp = sumPool.length ? composition(cfg.terms, prodPool.length > 0) : [cfg.terms];
      var first = makeBlock(comp[0], 1, cfg.range, prodPool, relaxed);
      if (!first) continue;

      var terms = [];
      var syms = [];
      var running = first.value;
      var peak = first.value;        // nejvyšší číslo, které v příkladu zazní
      var ok = true;

      pushBlock(terms, syms, first, null);

      for (var b = 1; b < comp.length; b++) {
        var order = shuffled(sumPool);
        var added = false;

        for (var i = 0; i < order.length && !added; i++) {
          var op = order[i];
          var lo = 1;
          var hi = op === "add" ? cfg.range - running : running - 1;
          var blk = makeBlock(comp[b], lo, hi, prodPool, relaxed);
          if (!blk) continue;
          running = applyOp(op, running, blk.value);
          peak = Math.max(peak, running, blk.value);
          pushBlock(terms, syms, blk, OPS[op].sym);
          added = true;
        }

        if (!added) { ok = false; break; }
      }

      if (!ok || terms.length !== cfg.terms) continue;

      /* V rozsahu do 20 chceme převážně příklady, které se přes desítku dostanou.
         Nízké se propustí jen občas, ať to není samá jednoduchá matematika. */
      if (!relaxed && cfg.range > 10 && peak < HIGH_FROM && rnd(100) >= EASY_SHARE) continue;

      return { terms: terms, ops: syms, result: running };
    }

    return null;
  }

  /* Blok se do zápisu vloží zleva doprava; joinSym je + nebo − před blokem. */
  function pushBlock(terms, syms, blk, joinSym) {
    var nums = blk.nums || [blk.value];
    if (joinSym) syms.push(joinSym);
    terms.push(nums[0]);
    for (var i = 1; i < nums.length; i++) {
      syms.push(blk.syms[i - 1]);
      terms.push(nums[i]);
    }
  }

  function renderTask() {
    el.task.textContent = "";
    var frag = document.createDocumentFragment();

    task.terms.forEach(function (n, i) {
      if (i > 0) {
        var op = document.createElement("span");
        op.className = "op";
        op.textContent = task.ops[i - 1];
        frag.appendChild(op);
      }
      var num = document.createElement("span");
      num.textContent = String(n);
      frag.appendChild(num);
    });

    var eq = document.createElement("span");
    eq.className = "eq";
    eq.textContent = "=";
    frag.appendChild(eq);

    answer = document.createElement("span");
    answer.id = "answer";
    answer.setAttribute("role", "status");
    answer.setAttribute("aria-label", "Výsledek");
    frag.appendChild(answer);

    el.task.dataset.n = String(task.terms.length);
    el.task.appendChild(frag);
  }

  function renderProgress() {
    el.progress.textContent = "";
    for (var i = 0; i < ROUND; i++) {
      var d = document.createElement("span");
      d.className = "dot" + (results[i] ? " " + results[i] : (i === results.length ? " now" : ""));
      el.progress.appendChild(d);
    }
  }

  function paintStreak() {
    el.streak.textContent = String(streak);
    el.best.textContent = String(best);
  }

  function paintTowerCount() {
    el.towerCount.textContent = String(tower);
    var unit = document.createElement("span");
    unit.innerHTML = "&nbsp;" + (tower === 1 ? "kostka" : (tower >= 2 && tower <= 4 ? "kostky" : "kostek"));
    el.towerCount.appendChild(unit);
  }

  /* Druhy kostek od nejběžnějšího po nejvzácnější; čísla jsou šance v procentech. */
  var BLOCKS = ["grass", "stone", "plank", "sand", "nether", "obsidian"];
  var RARITY = { grass: 27, stone: 24, plank: 20, sand: 15, nether: 9, obsidian: 5 };
  var NAMES = {
    grass: "Blok trávy", stone: "Kámen", plank: "Dubová prkna",
    sand: "Písek", nether: "Netherrack", obsidian: "Obsidián"
  };

  /* Typ kostky je hash z jejího indexu — vypadá to rozházeně, ale po překreslení
     zdi (i po uložení do truhly) zůstane každá kostka stejná. */
  function blockFor(index) {
    var h = Math.imul(index + 1, 2654435761);
    h ^= h >>> 15;
    h = Math.imul(h, 668265263);
    h ^= h >>> 13;

    var roll = (h >>> 0) % 100;
    var acc = 0;
    for (var i = 0; i < BLOCKS.length; i++) {
      acc += RARITY[BLOCKS[i]];
      if (roll < acc) return BLOCKS[i];
    }
    return BLOCKS[0];
  }

  /* Kostka = izometrický kubus ze <symbol>; --r je patro odspodu, --c sloupec.
     Vyšší patro leží nad spodním i v z-ose. */
  /* Sprite kostky — používá ho zeď, inventář truhly i plocha na stavění. */
  function blockSprite(type) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 32 32");
    svg.setAttribute("aria-hidden", "true");
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#blk-" + type);
    svg.appendChild(use);
    return svg;
  }

  function makeBrick(index, row, col) {
    var type = blockFor(index);
    var b = document.createElement("div");
    b.className = "brick";
    b.style.setProperty("--r", String(row));
    b.style.setProperty("--c", String(col));
    b.dataset.name = NAMES[type];
    b.appendChild(blockSprite(type));
    return b;
  }

  var MIN_BW = 13;       // pod tuhle velikost kostku už nezmenšujeme
  var ZOOM_STEP = 0.78;  // zeď se zmenšuje skokem, ne plynule
  var MAX_ZOOM_LEVEL = 12;

  var zoomLevel = 0;     // 0 = plná velikost kostky

  function fitAt(level, base, height, allowance) {
    var bw = Math.max(MIN_BW, base * Math.pow(ZOOM_STEP, level));
    var rows = Math.max(2, Math.floor((height - bw) / (bw * 0.75)) + 1);
    var stepX = bw * (1 + GAP_X);
    var maxCols = Math.max(1, Math.floor((allowance + bw * GAP_X) / stepX));
    return { level: level, bw: bw, rows: rows, maxCols: maxCols, capacity: rows * maxCols };
  }

  /* Mřížka zdi: kolik pater se vejde do výšky stránky a kolik sloupců do vyhrazené
     šířky. Když se zeď nevejde, zmenší se o jeden skok — nikdy nezmizí ani kostka.
     Skoky (a rezerva při zvětšování) drží zeď v klidu, dokud opravdu nedoroste. */
  function towerGrid() {
    var base = el.probe.offsetWidth || 36;
    var height = el.tower.clientHeight || base * 6;
    // svislý pruh vpravo smí zabrat jen část stránky; pás pod klávesnicí celou šířku
    var allowance = SIDE_LAYOUT.matches
      ? Math.max(base, el.page.clientWidth * RAIL_SHARE)
      : Math.max(base, el.rail.clientWidth);

    var grid = fitAt(zoomLevel, base, height, allowance);

    while (tower > grid.capacity && grid.bw > MIN_BW && zoomLevel < MAX_ZOOM_LEVEL) {
      zoomLevel++;
      grid = fitAt(zoomLevel, base, height, allowance);
    }

    // zvětšit zpátky jen s jasnou rezervou, ať zeď nepřeskakuje na hranici
    while (zoomLevel > 0) {
      var bigger = fitAt(zoomLevel - 1, base, height, allowance);
      if (tower * 1.15 > bigger.capacity) break;
      zoomLevel--;
      grid = bigger;
    }

    return grid;
  }

  // stejná podmínka jako v CSS: pruh vpravo jen na šířku
  var SIDE_LAYOUT = window.matchMedia("(min-width: 30rem) and (orientation: landscape)");
  var painted = null;    // poslední nakreslená mřížka, aby přepočet neběhal ve smyčce

  function paintTower(dropLast) {
    var grid = towerGrid();
    var stamp = grid.rows + "/" + grid.maxCols + "/" + Math.round(grid.bw) + "/" + tower + "/" + banked;
    if (!dropLast && stamp === painted) return;
    painted = stamp;
    var visible = Math.min(tower, grid.capacity);
    var offset = tower - visible;   // jen kdyby zeď přetekla i po zmenšení
    var cols = Math.min(grid.maxCols, Math.max(1, Math.ceil(visible / grid.rows)));

    el.rail.style.setProperty("--zoom", (grid.bw / (el.probe.offsetWidth || grid.bw)).toFixed(4));
    el.rail.style.setProperty("--cols", String(cols));
    el.tower.textContent = "";

    for (var i = 0; i < visible; i++) {
      // sloupec se plní odspodu nahoru, teprve pak začíná další vedle
      el.tower.appendChild(makeBrick(banked + offset + i, i % grid.rows, Math.floor(i / grid.rows)));
    }

    if (dropLast && el.tower.lastElementChild) el.tower.lastElementChild.classList.add("new");
    paintTowerCount();
  }

  /* Druhy kostek plynou z jejich indexu, takže obsah truhel se nemusí ukládat —
     spočítá se pokaždé znovu a je vždy stejný. */
  function countTypes(from, to, into) {
    var counts = into || {};
    for (var i = from; i < to; i++) {
      var t = blockFor(i);
      counts[t] = (counts[t] || 0) + 1;
    }
    return counts;
  }

  function usedSlots(counts) {
    var n = 0;
    BLOCKS.forEach(function (t) { n += Math.ceil((counts[t] || 0) / STACK); });
    return n;
  }

  function stacksOf(counts) {
    var stacks = [];
    BLOCKS.forEach(function (type) {
      var left = counts[type] || 0;
      while (left > 0) {
        stacks.push({ type: type, n: Math.min(STACK, left) });
        left -= STACK;
      }
    });
    return stacks;
  }

  /* Kostky se sypou po padesátkách do první truhly; další truhla se objeví teprve
     tehdy, když se do té předchozí padesátka už nevejde (má plných 54 políček). */
  function chestList() {
    var list = [];
    var open = null;

    for (var from = 0; from < banked; from += BANK_SIZE) {
      var batch = countTypes(from, Math.min(from + BANK_SIZE, banked));

      if (open) {
        var merged = {};
        BLOCKS.forEach(function (t) { merged[t] = (open.counts[t] || 0) + (batch[t] || 0); });

        if (usedSlots(merged) <= CHEST_SLOTS * 2) {
          open.counts = merged;
          open.count += BANK_SIZE;
          continue;
        }
      }

      open = { start: from, count: BANK_SIZE, counts: batch };
      list.push(open);
    }

    list.forEach(function (chest) {
      chest.big = chest.count > BANK_SIZE;                  // od stovky velká truhla
      chest.slots = chest.big ? CHEST_SLOTS * 2 : CHEST_SLOTS;
      chest.name = chest.big ? "Velká truhla" : "Truhla";
    });
    return list;
  }

  var chests = [];
  var openChest = -1;

  function chestSprite(big) {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", big ? "0 0 50 42" : "0 0 34 34");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("class", "chest-art");
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", big ? "#chest-double" : "#chest-single");
    svg.appendChild(use);
    return svg;
  }

  function paintChest() {
    var show = banked >= BANK_SIZE;
    el.chestCol.hidden = !show;
    el.page.classList.toggle("has-chest", show);
    if (!show) { chests = []; closeChest(); return; }

    chests = chestList();
    el.chestN.textContent = String(banked);
    el.chestLab.textContent = chests.length > 1 ? "Truhly" : chests[0].name;
    el.chestStack.textContent = "";

    chests.forEach(function (chest, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chest" + (chest.big ? " double" : "");
      b.dataset.i = String(i);
      b.dataset.name = chest.name + " · " + chest.count + " kostek";
      b.setAttribute("aria-expanded", "false");
      b.appendChild(chestSprite(chest.big));
      el.chestStack.appendChild(b);
    });

    if (openChest >= chests.length) closeChest();
    else if (openChest >= 0) showPanel(openChest);
  }

  function showPanel(i) {
    var chest = chests[i];
    if (!chest) return;

    openChest = i;
    el.chestTitle.textContent = chest.name;
    el.chestSize.textContent = chest.big ? "6 × 9" : "3 × 9";

    var stacks = stacksOf(chest.counts);
    el.chestGrid.textContent = "";

    for (var k = 0; k < chest.slots; k++) {
      var cell = document.createElement("div");
      cell.className = "slot";
      var stack = stacks[k];

      if (stack) {
        cell.dataset.name = NAMES[stack.type];
        cell.appendChild(blockSprite(stack.type));

        var n = document.createElement("b");
        n.textContent = String(stack.n);
        cell.appendChild(n);
      }

      el.chestGrid.appendChild(cell);
    }

    // inventář vyskočí nad tu truhlu, na kterou se kliklo
    var btn = el.chestStack.querySelector('[data-i="' + i + '"]');
    if (btn) {
      var col = el.chestCol.getBoundingClientRect();
      el.chestPanel.style.bottom = Math.round(col.bottom - btn.getBoundingClientRect().top + 8) + "px";
      btn.setAttribute("aria-expanded", "true");
    }
    el.chestCol.classList.add("open");
  }


  /* ================== stavění z kostiček (MATH-1) ==================
     Jediný nový ukládaný stav je `build` — mapa "x,y" → druh kostky.
     Kolik čeho zbývá v truhle se nikde neukládá, počítá se jako
     nasbírané(druh) − kostky téhož druhu na ploše. Nemůže tak vzniknout
     rozpor mezi dvěma čísly a poškozený localStorage se sám srovná. */

  var build = {};
  var building = false;   // režim stavění
  var picked = null;      // vybraný druh z palety
  var wrecking = false;   // režim bourání
  var collectedAt = -1;   // pro jaké `banked` je spočítané `collectedCounts`
  var collectedCounts = {};

  (function loadBuild() {
    if (!saved.build || typeof saved.build !== "object") return;
    Object.keys(saved.build).forEach(function (key) {
      var m = /^(\d+),(\d+)$/.exec(key);
      var type = saved.build[key];
      if (!m || BLOCKS.indexOf(type) === -1) return;
      if (+m[1] < BUILD_COLS && +m[2] < BUILD_ROWS) build[key] = type;
    });
  })();

  function collected() {
    if (collectedAt !== banked) {
      collectedCounts = countTypes(0, banked);
      collectedAt = banked;
    }
    return collectedCounts;
  }

  function onCanvas(type) {
    var n = 0;
    Object.keys(build).forEach(function (k) { if (build[k] === type) n++; });
    return n;
  }

  function stock(type) {
    return Math.max(0, (collected()[type] || 0) - onCanvas(type));
  }

  /* Odemyká se, až je první truhla doslova plná — stejné pravidlo, které
     rozhoduje o přistavení další truhly. `?stavet` jsou vrátka pro rodiče. */
  function buildUnlocked() {
    if (/[?&]stavet(=|&|$)/.test(location.search)) return true;
    var first = chests[0];
    return !!first && usedSlots(first.counts) >= first.slots;
  }

  function paintMode() {
    var show = banked >= BANK_SIZE;
    el.mode.hidden = !show;
    if (!show) return;

    var open = buildUnlocked();
    el.mode.classList.toggle("locked", !open);
    el.mode.setAttribute("aria-pressed", building ? "true" : "false");
    el.mode.setAttribute("aria-disabled", open ? "false" : "true");

    if (building) {
      el.modeLabel.textContent = "Počítání";
      el.mode.dataset.name = "Zpátky k příkladům";
    } else if (open) {
      el.modeLabel.textContent = "Stavění";
      el.mode.dataset.name = "Postav si něco z nasbíraných kostek";
    } else {
      var first = chests[0];
      el.modeLabel.textContent = "🔒 Stavění " + usedSlots(first.counts) + "/" + first.slots;
      el.mode.dataset.name = "Stavění se otevře, až bude truhla plná";
    }
  }

  function setMode(on) {
    building = !!on && buildUnlocked();
    el.page.classList.toggle("building", building);
    el.build.hidden = !building;
    el.wrap.hidden = building;
    el.rail.hidden = building;

    if (building) {
      el.chestCol.hidden = true;
      closeChest();
      paintCanvas();
      paintPalette();
    } else {
      paintChest();
      paintTower(false);
    }
    paintMode();
  }

  /* Mřížka je pevná 16 × 12, takže stavba vypadá stejně na telefonu i na tabletu;
     mění se jen velikost buňky podle dostupného místa. */
  function cellSize() {
    var box = el.canvasWrap;
    var pad = 16;
    var byWidth = (box.clientWidth - pad) / BUILD_COLS;
    var height = box.clientHeight - pad;
    // stavba je vysoká (rows − 1) × 0,75 + 1 kostky
    var rowsTall = (BUILD_ROWS - 1) * 0.75 + 1;
    var size = (SIDE_LAYOUT.matches && height > 40)
      ? Math.min(byWidth, height / rowsTall)
      : byWidth;
    return Math.max(14, Math.floor(size));
  }

  function paintCanvas() {
    el.canvas.style.setProperty("--cols-b", String(BUILD_COLS));
    el.canvas.style.setProperty("--rows-b", String(BUILD_ROWS));
    el.canvas.style.setProperty("--cell", cellSize() + "px");
    el.canvas.textContent = "";

    for (var y = 0; y < BUILD_ROWS; y++) {
      for (var x = 0; x < BUILD_COLS; x++) {
        var key = x + "," + y;
        el.canvas.appendChild(makeCell(key));
        var blk = makeBlock(key);
        if (blk) el.canvas.appendChild(blk);
      }
    }
  }

  /* Terč pro prst — leží ve své řadě, terče se nepřekrývají. */
  function makeCell(key) {
    var xy = key.split(",");
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.key = key;
    cell.style.setProperty("--c", xy[0]);
    cell.style.setProperty("--r", String(BUILD_ROWS - 1 - +xy[1]));
    return cell;
  }

  /* Kostka přečnívá nad svůj terč, proto je to samostatný prvek bez reakce na prst. */
  function makeBlock(key) {
    var type = build[key];
    if (!type) return null;

    var xy = key.split(",");
    var blk = document.createElement("div");
    blk.className = "blk";
    blk.dataset.blk = key;
    blk.dataset.name = NAMES[type];
    blk.style.setProperty("--c", xy[0]);
    blk.style.setProperty("--r", String(BUILD_ROWS - 1 - +xy[1]));
    blk.appendChild(blockSprite(type));
    return blk;
  }

  function repaintCell(key) {
    var old = el.canvas.querySelector('[data-blk="' + key + '"]');
    if (old) old.remove();
    var blk = makeBlock(key);
    if (blk) el.canvas.appendChild(blk);
  }

  function paintPalette() {
    if (picked && stock(picked) === 0) picked = null;
    el.paletteRow.textContent = "";

    BLOCKS.forEach(function (type) {
      var left = stock(type);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "pick";
      b.dataset.type = type;
      b.dataset.name = NAMES[type] + " · v truhle " + left;
      b.disabled = left === 0;
      b.setAttribute("aria-pressed", picked === type ? "true" : "false");
      b.appendChild(blockSprite(type));

      var n = document.createElement("b");
      n.textContent = String(left);
      b.appendChild(n);

      el.paletteRow.appendChild(b);
    });
  }

  /* Vybrání druhu nesmí paletu překreslit — jinak zmizí tlačítko, na kterém
     právě drží prst, a tažení se přeruší. */
  function markPicked() {
    Array.prototype.forEach.call(el.paletteRow.querySelectorAll(".pick"), function (b) {
      b.setAttribute("aria-pressed", b.dataset.type === picked ? "true" : "false");
    });
  }

  function placeBlock(key, type) {
    if (build[key] || stock(type) <= 0) return;
    build[key] = type;
    save();
    repaintCell(key);
    paintPalette();
  }

  function takeBlock(key) {
    if (!build[key]) return;
    delete build[key];
    save();
    repaintCell(key);
    paintPalette();
  }

  /* ---- tažení kostky z palety na plochu ---- */

  var drag = null;

  function cellAt(x, y) {
    var node = document.elementFromPoint(x, y);
    return node && node.closest ? node.closest(".cell") : null;
  }

  function endDrag() {
    if (drag && drag.ghost) drag.ghost.remove();
    var hinted = el.canvas.querySelector(".cell.hint");
    if (hinted) hinted.classList.remove("hint");
    drag = null;
  }

  el.paletteRow.addEventListener("pointerdown", function (e) {
    var b = e.target.closest(".pick");
    if (!b || b.disabled) return;

    wrecking = false;
    el.wreck.setAttribute("aria-pressed", "false");
    picked = b.dataset.type;
    markPicked();

    drag = { type: picked, moved: false, ghost: null };

    // bez zachycení ukazatele tažení nesleduje prst mimo tlačítko;
    // pokládání klepnutím funguje i tak, takže chybu jen spolkneme
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* nevadí */ }
  });

  el.paletteRow.addEventListener("pointermove", function (e) {
    if (!drag) return;

    if (!drag.moved) {
      drag.moved = true;
      drag.ghost = document.createElement("div");
      drag.ghost.className = "drag";
      drag.ghost.style.width = drag.ghost.style.height = cellSize() + "px";
      drag.ghost.appendChild(blockSprite(drag.type));
      document.body.appendChild(drag.ghost);
    }

    var size = cellSize();
    drag.ghost.style.left = (e.clientX - size / 2) + "px";
    drag.ghost.style.top = (e.clientY - size / 2) + "px";

    var hinted = el.canvas.querySelector(".cell.hint");
    if (hinted) hinted.classList.remove("hint");
    var cell = cellAt(e.clientX, e.clientY);
    if (cell && !build[cell.dataset.key]) cell.classList.add("hint");
  });

  el.paletteRow.addEventListener("pointerup", function (e) {
    if (!drag) return;
    var type = drag.type;
    var moved = drag.moved;
    endDrag();

    if (!moved) return;            // jen klepnutí = vybrání druhu
    var cell = cellAt(e.clientX, e.clientY);
    if (cell) placeBlock(cell.dataset.key, type);
  });

  el.paletteRow.addEventListener("pointercancel", endDrag);

  /* ---- přesouvání už položené kostky ---- */

  var move = null;
  var skipClick = false;

  function endMove(restore) {
    if (move) {
      if (move.ghost) move.ghost.remove();
      if (restore) repaintCell(move.from);
    }
    var hinted = el.canvas.querySelector(".cell.hint");
    if (hinted) hinted.classList.remove("hint");
    move = null;
  }

  el.canvas.addEventListener("pointerdown", function (e) {
    var cell = e.target.closest(".cell");
    if (!cell || wrecking) return;

    var key = cell.dataset.key;
    if (!build[key]) return;        // prázdné pole se plní klepnutím, ne tažením

    move = { from: key, type: build[key], moved: false, ghost: null };
    try { el.canvas.setPointerCapture(e.pointerId); } catch (err) { /* nevadí */ }
  });

  el.canvas.addEventListener("pointermove", function (e) {
    if (!move) return;

    if (!move.moved) {
      move.moved = true;
      // kostku zvedneme: zmizí z místa a drží se pod prstem
      var lifted = el.canvas.querySelector('[data-blk="' + move.from + '"]');
      if (lifted) lifted.remove();

      move.ghost = document.createElement("div");
      move.ghost.className = "drag";
      move.ghost.style.width = move.ghost.style.height = cellSize() + "px";
      move.ghost.appendChild(blockSprite(move.type));
      document.body.appendChild(move.ghost);
    }

    var size = cellSize();
    move.ghost.style.left = (e.clientX - size / 2) + "px";
    move.ghost.style.top = (e.clientY - size / 2) + "px";

    var hinted = el.canvas.querySelector(".cell.hint");
    if (hinted) hinted.classList.remove("hint");
    var over = cellAt(e.clientX, e.clientY);
    if (over && !build[over.dataset.key]) over.classList.add("hint");
  });

  el.canvas.addEventListener("pointerup", function (e) {
    if (!move) return;

    var from = move.from;
    var type = move.type;
    var moved = move.moved;

    if (!moved) {                   // jen klepnutí: vezmi si ten druh do ruky
      endMove(false);
      picked = type;
      markPicked();
      skipClick = true;
      return;
    }

    var over = cellAt(e.clientX, e.clientY);
    var onPalette = document.elementFromPoint(e.clientX, e.clientY);
    onPalette = onPalette && onPalette.closest ? onPalette.closest(".palette") : null;

    endMove(false);
    skipClick = true;

    if (over && !build[over.dataset.key]) {
      delete build[from];
      build[over.dataset.key] = type;
      save();
      repaintCell(from);
      repaintCell(over.dataset.key);
    } else if (onPalette) {
      takeBlock(from);              // vytažením na paletu se kostka vrátí do truhly
    } else {
      repaintCell(from);            // nikam to nešlo, kostka zůstává
    }
  });

  el.canvas.addEventListener("pointercancel", function () { endMove(true); });

  el.canvas.addEventListener("click", function (e) {
    if (skipClick) { skipClick = false; return; }

    var cell = e.target.closest(".cell");
    if (!cell) return;

    var key = cell.dataset.key;

    if (wrecking) {
      // horní čtvrtina kostky spadá do terče nad ní — když je prázdný, boura se ta pod
      if (!build[key]) {
        var xy = key.split(",");
        var below = xy[0] + "," + (+xy[1] + 1);
        if (build[below]) key = below;
      }
      takeBlock(key);
      return;
    }

    if (picked && !build[key]) placeBlock(key, picked);
  });

  el.wreck.addEventListener("click", function (e) {
    unfocus(e, el.wreck);
    wrecking = !wrecking;
    el.wreck.setAttribute("aria-pressed", wrecking ? "true" : "false");
    if (wrecking) { picked = null; markPicked(); }
  });

  el.mode.addEventListener("click", function (e) {
    unfocus(e, el.mode);
    if (!buildUnlocked()) return;
    setMode(!building);
  });

  /* Vrací true, když se zeď právě uložila do truhly. */
  function towerAdd() {
    tower++;
    var stored = false;

    if (tower >= BANK_SIZE) {
      tower -= BANK_SIZE;
      banked += BANK_SIZE;
      stored = true;
    }

    save();
    paintTower(!stored);
    if (stored) closeChest();
    paintChest();
    paintMode();

    if (stored) {
      var top = el.chestStack.lastElementChild;   // nejvýš položená truhla
      if (top) {
        top.classList.add("pop");
        setTimeout(function () { top.classList.remove("pop"); }, 520);
      }
    }
    return stored;
  }

  function towerRemove() {
    if (tower === 0) return;
    var last = el.tower.lastElementChild;
    tower--;
    save();
    paintTowerCount();
    if (!last) { paintTower(false); return; }
    last.classList.add("gone");
    setTimeout(function () { paintTower(false); }, 340);
  }

  function setNote(text, cls) {
    el.note.textContent = "";
    el.note.className = "note" + (cls ? " " + cls : "");
    if (text) el.note.appendChild(document.createTextNode(text));
    return el.note;
  }

  function nextTask() {
    locked = false;
    tries = 0;
    task = makeTask();
    el.sheet.className = "sheet";
    setNote("");
    renderTask();
    renderProgress();
  }

  function beep(good) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      beep.ctx = beep.ctx || new Ctx();
      var ctx = beep.ctx;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = good ? 880 : 220;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.24);
    } catch (e) {}
  }

  function finishRound() {
    var first = results.filter(function (r) { return r === "first"; }).length;
    var second = results.filter(function (r) { return r === "second"; }).length;
    var stars = first >= 9 ? 3 : first >= 6 ? 2 : first >= 3 ? 1 : 0;
    el.stars.textContent = "★★★".slice(0, stars) + "☆☆☆".slice(0, 3 - stars);
    el.score.textContent = first + " z " + ROUND + " napoprvé";

    var hinted = results.filter(function (r) { return r === "miss"; }).length;
    var parts = ["nejdelší řada za sebou " + roundBest];
    if (second) parts.push(second + " na druhý pokus");
    if (hinted) parts.push(hinted + " s nápovědou");
    parts.push(banked ? "zeď " + tower + " · truhla " + banked : "zeď má " + tower);
    el.summary.textContent = parts.join(" · ");

    el.done.hidden = false;
    el.pad.hidden = true;
    el.sheet.hidden = true;
    el.again.focus({ preventScroll: true });
  }

  function advance(mark) {
    results.push(mark);
    renderProgress();
    if (results.length >= ROUND) {
      setTimeout(finishRound, 500);
      return;
    }
    setTimeout(nextTask, mark === "first" ? 550 : 800);
  }

  function check() {
    if (locked || !answer) return;
    var raw = answer.textContent.trim();
    if (raw === "") {
      setNote("Napiš výsledek.");
      return;
    }

    var val = parseInt(raw, 10);

    if (val === task.result) {
      locked = true;
      answer.classList.add("locked");
      el.sheet.className = "sheet is-ok";
      setNote((tries === 0 ? "Správně!" : "Správně, teď to je!") + " Kostka nahoru.", "ok");
      beep(true);

      if (towerAdd()) {
        setNote(banked === BANK_SIZE
          ? "Padesát kostek! Zeď je uložená v truhle."
          : (banked === 2 * BANK_SIZE
            ? "Dalších padesát — z truhly je velká truhla!"
            : "Dalších padesát kostek do truhly!"), "ok");
      }
      if (tries === 0) {
        streak++;
        if (streak > roundBest) roundBest = streak;
        if (streak > best) { best = streak; save(); }
      } else {
        streak = 0;
      }
      paintStreak();
      advance(tries === 0 ? "first" : (tries === 1 ? "second" : "miss"));
      return;
    }

    /* Špatná odpověď příklad nezruší — zůstává, dokud ho syn nedopočítá.
       Každý omyl sundá kostku, ale po nápovědě už věž nebouráme. */
    streak = 0;
    tries++;
    paintStreak();
    beep(false);
    el.sheet.className = "sheet is-bad is-shake";
    setTimeout(function () { el.sheet.className = "sheet"; }, 380);

    if (tries <= HINT_AFTER) towerRemove();

    if (tries < HINT_AFTER) {
      setNote("Ještě jednou, zkus to znovu.", "bad");
    } else {
      var note = setNote("", "bad");
      note.appendChild(document.createTextNode("Výsledek je "));
      var b = document.createElement("b");
      b.textContent = String(task.result);
      note.appendChild(b);
      note.appendChild(document.createTextNode(" — napiš ho."));
    }

    answer.textContent = "";
  }

  function type(digit) {
    if (locked || !answer) return;
    if (answer.textContent.length >= 2) return;
    answer.textContent = (answer.textContent + digit).replace(/^0(?=\d)/, "");
  }

  function del() {
    if (locked || !answer) return;
    answer.textContent = answer.textContent.slice(0, -1);
  }

  /* Po kliknutí ukazatelem necháme ovládací prvek odostřit — jinak by zaostřené
     tlačítko polykalo mezerník. Klávesnice píše přes posluchač na document,
     takže žádný prvek zaostřený být nemusí. (e.detail === 0 = spuštěno klávesou.) */
  function unfocus(e, node) {
    if (e.detail > 0 && node && node.blur) node.blur();
  }

  el.pad.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    unfocus(e, b);
    if (b.dataset.d) type(b.dataset.d);
    else if (b.dataset.act === "del") del();
    else if (b.dataset.act === "check") check();
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { closeChest(); return; }
    if (building) return;
    if (!el.done.hidden) {
      if (e.key === "Enter") { e.preventDefault(); startRound(); }
      return;
    }
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); type(e.key); }
    else if (e.key === "Backspace") { e.preventDefault(); del(); }
    else if (e.key === "Enter") { e.preventDefault(); check(); }
  });

  /* nastavení */
  function wireSeg(id, key, cast) {
    var box = document.getElementById(id);
    box.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      unfocus(e, b);
      cfg[key] = cast(b.dataset.v);
      paintSeg(box, key);
      save();
      startRound();
    });
    return box;
  }

  function paintSeg(box, key) {
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
      var on = String(cfg[key]) === b.dataset.v;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  var segRange = wireSeg("seg-range", "range", Number);
  var segTerms = wireSeg("seg-terms", "terms", Number);

  var opsBox = document.getElementById("seg-ops");

  opsBox.addEventListener("change", function (e) {
    var boxes = Array.prototype.slice.call(opsBox.querySelectorAll("input"));
    var any = boxes.some(function (b) { return b.checked; });
    if (!any) { e.target.checked = true; return; }   // aspoň jedno znaménko musí zůstat
    boxes.forEach(function (b) { cfg.ops[b.value] = b.checked; });
    if (e.target.blur) e.target.blur();
    save();
    startRound();
  });

  function paintOps() {
    Array.prototype.forEach.call(opsBox.querySelectorAll("input"), function (b) {
      b.checked = !!cfg.ops[b.value];
    });
  }

  el.again.addEventListener("click", function (e) { unfocus(e, el.again); startRound(); });

  var tip = document.getElementById("mc-tip");
  var tipFor = null;

  function moveTip(e) {
    var pad = 14;
    var x = e.clientX + pad;
    var y = e.clientY + pad + 4;
    if (x + tip.offsetWidth > window.innerWidth - 4) x = e.clientX - tip.offsetWidth - pad;
    if (y + tip.offsetHeight > window.innerHeight - 4) y = e.clientY - tip.offsetHeight - pad;
    tip.style.transform = "translate(" + Math.max(4, x) + "px," + Math.max(4, y) + "px)";
  }

  document.addEventListener("mousemove", function (e) {
    var host = e.target.closest ? e.target.closest("[data-name]") : null;

    if (!host) {
      if (tipFor) { tipFor = null; tip.classList.remove("on"); }
      return;
    }

    if (host !== tipFor) {
      tipFor = host;
      tip.textContent = host.dataset.name;
      tip.classList.add("on");
    }
    moveTip(e);
  });

  document.addEventListener("mouseleave", function () {
    tipFor = null;
    tip.classList.remove("on");
  });

  el.chestStack.addEventListener("click", function (e) {
    var btn = e.target.closest(".chest");
    if (!btn) return;
    e.stopPropagation();

    unfocus(e, btn);
    var i = parseInt(btn.dataset.i, 10);
    if (openChest === i) closeChest();
    else showPanel(i);
  });

  function closeChest() {
    openChest = -1;
    el.chestCol.classList.remove("open");
    Array.prototype.forEach.call(el.chestStack.querySelectorAll(".chest"), function (b) {
      b.setAttribute("aria-expanded", "false");
    });
  }

  document.addEventListener("click", function (e) {
    if (!el.chestCol.contains(e.target)) closeChest();
  });

  var resizeTimer = null;

  function scheduleRepaint(delay) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (building) paintCanvas();
      else paintTower(false);
    }, delay);
  }

  window.addEventListener("resize", function () { scheduleRepaint(150); });

  if (SIDE_LAYOUT.addEventListener) {
    SIDE_LAYOUT.addEventListener("change", function () { scheduleRepaint(60); });
  }

  if (window.ResizeObserver) {
    new ResizeObserver(function () { scheduleRepaint(60); }).observe(el.tower);
  }

  function startRound() {
    results = [];
    streak = 0;
    roundBest = 0;
    el.done.hidden = true;
    el.pad.hidden = false;
    el.sheet.hidden = false;
    nextTask();
    paintTower(false);
  }

  paintSeg(segRange, "range");
  paintSeg(segTerms, "terms");
  paintOps();
  paintStreak();
  paintChest();
  paintMode();
  paintTower(false);
  startRound();
})();
</script>
